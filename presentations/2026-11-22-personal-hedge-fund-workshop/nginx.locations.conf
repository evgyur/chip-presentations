# Existing Moscow Trading Week talk remains unchanged.
location = /presentations/mtw2 {
    return 308 /presentations/mtw2/;
}
location ^~ /presentations/mtw2/ {
    alias /var/www/human20-presentations/mtw2/;
    index index.html;
    autoindex off;
    expires 5m;
}

# Compatibility for workshop entry points; retain old downloadable CSVs.
location = /presentations/mtw2ws {
    return 308 /presentations/personal-hedge-fund/$is_args$args;
}
location = /presentations/mtw2ws/ {
    return 308 /presentations/personal-hedge-fund/$is_args$args;
}
location = /presentations/mtw2ws/index.html {
    return 308 /presentations/personal-hedge-fund/$is_args$args;
}
location = /presentations/mtw2ws/slides.html {
    return 308 /presentations/personal-hedge-fund/slides.html$is_args$args;
}
location ^~ /presentations/mtw2ws/ {
    alias /var/www/human20-presentations/mtw2ws/;
    autoindex off;
    expires 5m;
}
location = /presentations/personal-hedge-fund {
    return 308 /presentations/personal-hedge-fund/$is_args$args;
}
location ^~ /presentations/personal-hedge-fund/ {
    alias /var/www/human20-presentations/personal-hedge-fund/;
    index index.html;
    autoindex off;
    expires 5m;
}
